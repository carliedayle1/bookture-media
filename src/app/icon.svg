<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bookture Media">
  <title>Bookture Media</title>
  <!-- ink ground keeps the gold legible on light and dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#080b14" />
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13" fill="none" stroke="#9c7734" stroke-width="1.5" opacity="0.5" />

  <!-- rising arrow (growth) -->
  <path d="M21 30 L35 20" stroke="#efdca8" stroke-width="5" stroke-linecap="round" />
  <path d="M44.7 12.9 L38.8 25.2 L31.2 14.6 Z" fill="#efdca8" />

  <!-- open book -->
  <path d="M30.5 40 L9 34 L9 45 L30.5 52 Z" fill="#d6ae5c" />
  <path d="M33.5 40 L55 34 L55 45 L33.5 52 Z" fill="#d6ae5c" />
</svg>
